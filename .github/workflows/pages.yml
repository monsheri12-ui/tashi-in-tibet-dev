           anchor="if(anchors[place]?.[id])[x,y]=anchors[place][id];"
           s=edit(s,anchor,anchor+"if(place==='home'&&id==='window'&&task.visual==='washwindow')[x,y]=[122,108];")
           p.write_text(s)
