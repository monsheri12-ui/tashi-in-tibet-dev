name: Publish Tashi developer game

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the game archive
        run: >-
          curl --fail --location --retry 3
          --output bundle.zip
          "https://github.com/monsheri12-ui/tashi-in-tibet/releases/download/v1.0.2/tashi-in-tibet.zip"

      - name: Download the verified update
        run: >-
          curl --fail --location --retry 3
          --output update.zip
          "https://github.com/${{ github.repository }}/releases/download/v1.0.0/tashi-developer.zip"
      - name: Verify and extract the published game
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import zipfile

          archive = Path('bundle.zip')
          expected = '77bc075b8ee02b286c4e37d99882e2f9f8bca485ca12edb84c095319540add49'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('The game archive checksum does not match.')

          output = Path('dist')
          output.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  name = item.filename
                  if not item.flag_bits & 0x800:
                      try:
                          name = name.encode('cp437').decode('utf-8')
                      except UnicodeError:
                          pass
                  relative = PurePosixPath(name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Unsafe archive path.')
                  if item.is_dir():
                      continue
                  if name not in ('index.html', 'characters-preview.html') and not name.startswith(('assets/', 'licenses/')):
                      continue
                  target = output.joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(item))
          patch = Path('update.zip')
          if hashlib.sha256(patch.read_bytes()).hexdigest() != 'd96fc0b6a63ef0f1929a75153315ab4be04d9dc122ad4f6cca443a646d690397':
              raise SystemExit('The update checksum does not match.')
          with zipfile.ZipFile(patch) as bundle:
              for item in bundle.infolist():
                  relative = PurePosixPath(item.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Unsafe update path.')
                  if item.is_dir():
                      continue
                  if item.filename != 'index.html' and not item.filename.startswith('assets/'):
                      raise SystemExit('Unexpected update file.')
                  target = output.joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(item))
          (output / '.nojekyll').touch()
          if not (output / 'index.html').is_file():
              raise SystemExit('The game entry point is missing.')
          print(f'Prepared {sum(path.is_file() for path in output.rglob("*"))} files for publication.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
