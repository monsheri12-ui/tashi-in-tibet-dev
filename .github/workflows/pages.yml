      - name: Download and apply the verified scene patch
        env:
          TASHI_PATCH_REPOSITORY: ${{ github.repository }}
          TASHI_PATCH_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output scene-followup.py "https://raw.githubusercontent.com/${TASHI_PATCH_REPOSITORY}/${TASHI_PATCH_REVISION}/.github/patches/scenes-1.0.7.13.py"
          echo "0c2517337c8dfa58ee9a2ce9c925526fe9fa8003fbc8b59761def0316e4120e6  scene-followup.py" | sha256sum --check --strict
          python3 scene-followup.py

      - name: Apply verified animation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,base64,zlib
          root=Path('dist')
          expected={'build': 'developer', 'previousVersion': 'dev-1.0.5.13', 'version': 'dev-1.0.5.14', 'before': {'assets/js/game-08.js': '122fce3b34be33051ffc2b663f49a0d4efa0cf1588226f22e86d1ae69033e71c', 'assets/js/game-09.js': 'df60fb49616ad7f5d78656217452dee2704b8cef8b443d0ae6c7bbcde758b031', 'assets/js/game-29.js': '47438ff141e509494df7add874a17f494ac0ddbabcde539200ffbf15f582dcbb', 'assets/manifest.json': '1858c6974c0203223e94302ad408ebba6604e146fecfbba933095c7ddc4f5d55', 'index.html': 'cb826c24013e51966c65c6decde9ef9d8081d8650ba55cdc2d9678514327d0a0'}, 'after': {'assets/js/game-08.js': 'e2a34ea5ccb2044b7e1d2bcd7d2f90b22ab7a39e6c8ec3e9adafb6d324fbc040', 'assets/js/game-09.js': '90197093835db49f3fd16ff9cc826627a8c03132a3bdcf1c23938a0c488d2d23', 'assets/js/game-29.js': 'c987b0b51c8af0a4984b5e7f87e4b7a28aa06fe48e9e63d728dffdc2d635be26', 'assets/manifest.json': '28d351a9253e682af8249a15847820c54b4774cb565c155504675ebf276bbe1b', 'index.html': '55e40e9351d39253e5ce76101e2aae9bf6a7b4e93b35be7c53f76d144af9bba6'}}
          raw_sources=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw_sources).hexdigest()=='0ea1bacbb371d088a6aac8c81f973c72648f81dcebf4151895ce0058b44fe990'
          patches=json.loads(raw_sources)
          for name,digest in expected['before'].items():
              if digest is None: assert not (root/name).exists(),name
              else: assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          for i,(name,source) in enumerate(patches):
              namespace={'__name__':'release_patch_'+str(i),'__file__':name}
              exec(compile(source,name,'exec'),namespace)
              namespace['apply'](root)
          p=root/'index.html'
          s=p.read_text()
          assert s.count(expected['previousVersion'])==33
          p.write_text(s.replace(expected['previousVersion'],expected['version']))
          p=root/'assets/manifest.json'
          m=json.loads(p.read_text())
          m['htmlBytes']=(root/'index.html').stat().st_size
          scripts=sorted((root/'assets/js').glob('game-[0-9][0-9].js'))
          assert len(scripts)==30
          m['scriptBytes']=sum(q.stat().st_size for q in scripts)
          for name,meta in m['resources'].items():
              q=root/name
              meta.update(bytes=q.stat().st_size,sha256=hashlib.sha256(q.read_bytes()).hexdigest())
          p.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n')
          for name,digest in expected['after'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert len(m['resources'])==499
          actual_resources={str(p.relative_to(root)) for kind in ['images','fonts','audio'] for p in (root/'assets'/kind).rglob('*') if p.is_file()}
          assert set(m['resources'])==actual_resources
          for name,meta in m['resources'].items():
              data=(root/name).read_bytes()
              assert len(data)==meta['bytes'] and hashlib.sha256(data).hexdigest()==meta['sha256'],name
          assert m['htmlBytes']==(root/'index.html').stat().st_size
          assert m['scriptBytes']==sum(q.stat().st_size for q in scripts)
          print('Animation audit release verified:',expected['version'])
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5

