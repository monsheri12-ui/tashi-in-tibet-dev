           s=edit(s,"if(key!==hygieneKey){hygieneKey=key;hygieneStart=frame;hygieneExitDone=false;}\n  const age=frame-hygieneStart;", """if(key!==hygieneKey){hygieneKey=key;hygieneStart=null;hygieneExitDone=false;}
            if(hygieneStart===null){
