           s=edit(s,"if(!careVisual?.pending&&binding?.d===d&&GameUsha.tick(d,{scene,minute:binding.minute(),visible:!document.hidden,stimulus}))binding.onChange();", """const blockedBowls=home?Object.fromEntries(['eat','drink'].map(kind=>[kind,Math.hypot(fox.x-USHA_HOME_LAYOUT[kind].x,fox.y-USHA_HOME_LAYOUT[kind].y)<48])):null;
            if(!careVisual?.pending&&binding?.d===d&&GameUsha.tick(d,{scene,minute:binding.minute(),visible:!document.hidden,stimulus,blockedBowls}))binding.onChange();""")
