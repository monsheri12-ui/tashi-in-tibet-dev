           old="if(v==='washwindow'){const xx=111+(frame%16)*3,yy=35+Math.floor(frame%8/2)*5;edged(xx,yy,11,7,'#ece5d2','#90b9b3');R(xx-3,yy+3,5,3,'#d5a67b');for(const [dx,dy]of [[-6,12],[5,18],[13,11]])R(xx+dx,yy+dy,1,3,'#addbd4');line(115,28,12,'#e8f7e8');line(153,49,9,'#e8f7e8');return}"
