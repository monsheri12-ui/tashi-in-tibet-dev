           s=edit(s,"const brushing=combined?frame%100<55:v==='brushteeth';\n    if(v!=='washhands'||combined){GameArtV2.sprite(g,'hygiene',brushing?4:5,fox.x-22,fox.y-51,44,51);return;}", """const brushing=combined?frame-hygieneStart<32:v==='brushteeth';
