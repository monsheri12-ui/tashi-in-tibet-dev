             if(v==='washhands'&&!combined&&!faceWash&&!/вода не идёт/i.test(task.ru||'')){
              const sway=Math.sin(age*.5)*1.2;
              g.save();g.fillStyle='#f2f2e3';g.strokeStyle='#9b8b70';g.lineWidth=.35;
              for(const [dx,dy,r] of [[-3+sway,-22,1.6],[1-sway,-21,1.5],[3+sway,-23,1.1],[-1,-24,.9]]){g.beginPath();g.arc(fox.x+dx,fox.y+dy,r,0,Math.PI*2);g.fill();g.stroke();}
