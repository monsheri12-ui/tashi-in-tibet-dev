           s=edit(s,"function tick(d,{scene='home',now=Date.now(),minute=null,visible=true,stimulus=null}={}){", "function tick(d,{scene='home',now=Date.now(),minute=null,visible=true,stimulus=null,blockedBowls=null}={}){")
           s=edit(s,"  if(d.ai.until){\n   if(now<d.ai.until)return false;", "  if(d.ai.until){\n   // Do not consume food or water while Tashi is still at the bowl.\n   if(scene==='home'&&blockedBowls?.[d.activity]){d.ai.until+=seconds*1000;return false;}\n   if(now<d.ai.until)return false;")
